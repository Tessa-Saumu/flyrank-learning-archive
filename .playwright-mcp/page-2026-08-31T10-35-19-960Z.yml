  - main [ref=f7e16]:
    - generic [ref=f7e17]:
      - generic [ref=f7e18]:
        - paragraph [ref=f7e19]: Reflection
        - heading "Final Reflection" [level=1] [ref=f7e20]
        - paragraph [ref=f7e21]: "This is the reflection the FL-10 brief asked for: 500 to 800 words, written for the person I was in Week 1. It is not a summary of the archive; it is an account of what specifically changed in how I work."
      - note "FL-10 convergence" [ref=f7e22]:
        - generic [ref=f7e23]:
          - generic [ref=f7e24]: Portfolio / Public Work
          - generic [ref=f7e25]: ─┐
          - generic [ref=f7e26]: FL-10
          - generic [ref=f7e27]: ─┘
          - generic [ref=f7e28]: Agent / Systems Work
          - generic [ref=f7e29]: └→ Retrospective
        - paragraph [ref=f7e30]: FL-10 is the point where the Portfolio / Public Work strand and the AI Systems / Agents strand converge into a single final package, and this retrospective is that package in words.
      - generic [ref=f7e31]:
        - region [ref=f7e32]:
          - heading "What I set out to do" [level=2] [ref=f7e33]
          - paragraph [ref=f7e34]: I started the programme wanting to be able to point at finished things, not to tell people I had tried things. On the Machine Learning side I wanted to take a vague interest in search and turn it into a lane I could defend in a written paper. On the AI Fluency side I wanted a portfolio that existed, a public site that was actually live, and an agent that did a real job rather than a demo.
          - paragraph [ref=f7e35]: The first weeks made the job concrete. ML-01 and ML-02 forced me to write down a research question and a decision before I had a model. FL Proving and FL Sitemap did the same thing from the other direction, asking what I was proving and then drawing the path that would prove it. I did not yet know how much of the rest of the programme those framing steps would explain.
        - region [ref=f7e36]:
          - heading "What changed" [level=2] [ref=f7e37]
          - paragraph [ref=f7e38]: The biggest change was learning to separate the thing I built from the claim I could honestly make about it. ML-07 and ML-08 made me build a baseline before a model and then compare on the same metric. ML-09 then made me audit that comparison, look for leakage, and rewrite the claim so it said only what the evidence supported. That is not a writing rule; it is a workflow rule.
          - paragraph [ref=f7e39]: The prompting and workflow work changed the way I use tools rather than the way I think about them. FL-04 and FL-05 pushed me to treat a pipeline and an agent as things with defined jobs, inputs, and ways to evaluate, and FL-06 wrote the guardrails down so the agent did not drift. By the time I documented it in FL-09, the habit of naming what a tool was for and what it was not for had become automatic.
          - paragraph [ref=f7e40]: I also learned to ship early. FL Ship and PF-04 made a blank page live before it was good, and everything after that was added to something real instead of planned in the abstract. FL Crit and FL Break then made me seek out the failure instead of avoiding it.
          - paragraph [ref=f7e41]: The two tracks turned out to share more than common vocabulary. Problem framing, evaluation, human judgment, deployment, and communication call from both sides, just with different tools and different artefacts.
        - region [ref=f7e42]:
          - heading "What I would build next" [level=2] [ref=f7e43]
          - paragraph [ref=f7e44]: "I would take the ML lane further in a direction the brief deliberately left open, applying the validation and claim-audit discipline to a live system where the data keeps changing. I would also wire the two strands into a single working habit: one agent, documented and reproducible, that makes the everyday research and writing loop I actually use, not a showcase."
        - region [ref=f7e45]:
          - heading "The three most transferable things I learned" [level=2] [ref=f7e46]
          - list [ref=f7e47]:
            - listitem [ref=f7e48]:
              - generic [ref=f7e49]: "01"
              - generic [ref=f7e50]: Define the thing you are trying to prove before you choose the tool. A written claim or question decides more of the outcome than any single library or model choice.
            - listitem [ref=f7e51]:
              - generic [ref=f7e52]: "02"
              - generic [ref=f7e53]: Always have a baseline and a stated metric before you compare anything. Comparison without a reference point produces confidence, not evidence.
            - listitem [ref=f7e54]:
              - generic [ref=f7e55]: "03"
              - generic [ref=f7e56]: Find the failure on purpose. A clearly explained negative result, an honest limit, or a site that breaks when you attack it is worth more than a polished claim you have not tested.
      - paragraph [ref=f7e57]:
        - text: The next-student version of this reflection, distilled into six traceable lessons, is on the
        - link "What I Wish I Knew" [ref=f7e58] [cursor=pointer]:
          - /url: /framework/wish-i-knew/
        - text: page. The step-by-step method it points to is on
        - link "My Working Framework" [ref=f7e59] [cursor=pointer]:
          - /url: /framework/
        - text: .
